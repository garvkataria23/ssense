<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="The requested S.Sense Salon & Spa page could not be found.">
    <title>404 - Page Not Found | S.Sense Salon & Spa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            text-align: center;
            max-width: 600px;
            width: 100%;
            animation: fadeIn 0.6s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-icon {
            font-size: 120px;
            color: #667eea;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-20px);
            }
            60% {
                transform: translateY(-10px);
            }
        }

        h1 {
            font-size: 72px;
            color: #333;
            margin-bottom: 20px;
            font-weight: 700;
        }

        h2 {
            font-size: 28px;
            color: #555;
            margin-bottom: 15px;
            font-weight: 600;
        }

        p {
            font-size: 16px;
            color: #777;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 15px 35px;
            text-decoration: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
            transform: translateY(-3px);
        }

        .search-box {
            margin-top: 30px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .search-input {
            padding: 12px 20px;
            border: 2px solid #ddd;
            border-radius: 50px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            width: 250px;
        }

        .search-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-btn {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        .links {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #eee;
        }

        .links h3 {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
        }

        .quick-links {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        .quick-links a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .quick-links a:hover {
            background: #f0f0f0;
            color: #764ba2;
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 56px;
            }

            h2 {
                font-size: 22px;
            }

            .error-icon {
                font-size: 80px;
            }

            .btn {
                padding: 12px 25px;
                font-size: 14px;
            }

            .search-input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-icon">404</div>
        <h1>404</h1>
        <h2>Oops! Page Not Found</h2>
        <p>The page you're looking for seems to have gotten a new haircut and disappeared! Don't worry, we'll help you find what you need.</p>
        
        <div class="btn-container">
            <a href="/" class="btn btn-primary">Go to Homepage</a>
            <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
        </div>

        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="Search our website...">
            <button class="search-btn" onclick="searchSite()">Search</button>
        </div>

        <div class="links">
            <h3>Quick Links</h3>
            <div class="quick-links">
                <a href="booking.html">Book Appointment</a>
                <a href="/beauty-salon.html">Services</a>
                <a href="/pricing-1.html">Pricing</a>
                <a href="gallery.html">Gallery</a>
                <a href="team.html">Our Team</a>
                <a href="contact.html">Contact Us</a>
                <a href="blog-listing.html">Blog</a>
                <a href="about.html">About Us</a>
            </div>
        </div>
    </div>

    <script>
        function searchSite() {
            const query = document.getElementById('searchInput').value.trim();
            if (query) {
                window.location.href = 'https://www.google.com/search?q=site:ssensesalon.com ' + encodeURIComponent(query);
            }
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchSite();
            }
        });

        setTimeout(function() {
            document.getElementById('searchInput').focus();
        }, 500);
    </script>
</body>
</html>
