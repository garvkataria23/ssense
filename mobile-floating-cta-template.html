<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reusable Mobile Floating CTA</title>
  <style>
    :root {
      --floating-cta-brand: #b63d63;
      --floating-cta-brand-dark: #a93459;
      --floating-cta-blush: #fff8f5;
    }

    body {
      min-height: 160vh;
      margin: 0;
      background: #fff8f5;
      color: #171717;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 20px 140px;
    }

    .demo-card {
      padding: 28px;
      border: 1px solid rgba(182, 61, 99, .16);
      border-radius: 24px;
      background: #fff;
    }

    /*
      Copy from here into your website CSS.
      This floating CTA is mobile-only. On desktop/tablet it stays hidden.
    */
    .mobile-floating-cta {
      display: none;
    }

    @media (max-width: 767.98px) {
      body {
        padding-bottom: calc(90px + env(safe-area-inset-bottom));
      }

      .mobile-floating-cta {
        position: fixed;
        right: 14px;
        bottom: max(14px, env(safe-area-inset-bottom));
        z-index: 2147483000;
        display: flex;
        width: 44px;
        max-width: 44px;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        gap: 0;
        padding: 0;
        overflow: visible;
        border: 0;
        background: transparent;
        box-shadow: none;
        transform: none;
        transition: width .24s ease, max-width .24s ease, background .24s ease, box-shadow .24s ease, padding .24s ease;
      }

      .mobile-floating-cta.is-open {
        right: 18px;
        left: 18px;
        width: auto;
        max-width: none;
        min-height: 44px;
        justify-content: space-between;
        gap: 8px;
        padding: 3px 6px;
        border: 1px solid rgba(182, 61, 99, .16);
        border-radius: 999px;
        background: var(--floating-cta-blush);
        box-shadow: 0 14px 34px rgba(21, 21, 21, .14);
        backdrop-filter: blur(14px);
      }

      .mobile-floating-cta__toggle {
        display: grid;
        flex: 0 0 44px;
        width: 44px;
        height: 44px;
        min-height: 44px;
        place-items: center;
        padding: 0;
        border: 1px solid rgba(182, 61, 99, .18);
        border-radius: 50%;
        background: var(--floating-cta-brand);
        color: #fff;
        box-shadow: 0 12px 28px rgba(182, 61, 99, .24);
        font: 700 1.35rem/1 Georgia, serif;
        cursor: pointer;
      }

      .mobile-floating-cta.is-open .mobile-floating-cta__toggle {
        display: none;
      }

      .mobile-floating-cta__link {
        display: none;
        min-width: 0;
        min-height: 36px;
        height: 36px;
        flex: 1 1 0;
        align-items: center;
        justify-content: center;
        padding: 0 6px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        text-decoration: none;
        opacity: 0;
        transform: translateY(6px) scale(.96);
        transition: opacity .2s ease, transform .2s ease, background .2s ease;
      }

      .mobile-floating-cta.is-open .mobile-floating-cta__link {
        display: inline-flex;
        opacity: 1;
        transform: none;
      }

      .mobile-floating-cta__link:hover,
      .mobile-floating-cta__link:focus-visible {
        background: rgba(182, 61, 99, .08);
      }

      .mobile-floating-cta__icon {
        width: 22px;
        height: 22px;
        display: block;
      }

      .mobile-floating-cta__call { color: #050505; }
      .mobile-floating-cta__whatsapp { color: #008f43; }
      .mobile-floating-cta__facebook { color: #003f88; }
      .mobile-floating-cta__instagram { color: #8a0038; }
    }
  </style>
</head>
<body>
  <main>
    <div class="demo-card">
      <h1>Mobile Floating CTA Template</h1>
      <p>This page contains a reusable mobile-only floating contact button. Resize to mobile width to preview it.</p>
      <p>Use the instructions inside this file to copy it into another website.</p>
    </div>
  </main>

    Replace phone numbers and social URLs below.
  -->

  </div>

  <script>
    /*
      Copy this script before </body> on your other website.
      If your site already uses this class name, rename mobile-floating-cta everywhere.
    */
    (function () {
      var ctas = Array.prototype.slice.call(document.querySelectorAll('.mobile-floating-cta'));
      if (!ctas.length) return;

      ctas.forEach(function (cta) {
        var toggle = cta.querySelector('.mobile-floating-cta__toggle');
        if (!toggle) return;

        toggle.addEventListener('click', function () {
          var isOpen = cta.classList.toggle('is-open');
          toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
          toggle.setAttribute('aria-label', isOpen ? 'Close quick contact options' : 'Open quick contact options');
        });
      });

      document.addEventListener('click', function (event) {
        if (event.target.closest('.mobile-floating-cta')) return;
        ctas.forEach(function (cta) {
          cta.classList.remove('is-open');
          var toggle = cta.querySelector('.mobile-floating-cta__toggle');
          if (toggle) {
            toggle.setAttribute('aria-expanded', 'false');
            toggle.setAttribute('aria-label', 'Open quick contact options');
          }
        });
      });
    })();
  </script>
</body>
</html>
